[preannotation_morph_with_bert]
input_dir = UD_Estonian-EDT-r2.18
morph_layer = morph_with_bert
seed = 43
dictionarize = True
remove_empty_nodes = True
remove_deps = True
remove_misc = True
output_dir = edt_2.18/preannotated/morph_with_bert

[join_morph_with_bert_train_full]
input_dir = edt_2.18/preannotated/morph_with_bert
concatenate = train, dev
output_dir = edt_2.18/preannotated/morph_with_bert

[train_stanza_morph_with_bert_full]
experiment_type = full_data
train_file = edt_2.18/preannotated/morph_with_bert/et_edt-ud-train-morph_with_bert.conllu
eval_file  = edt_2.18/preannotated/morph_with_bert/et_edt-ud-dev-morph_with_bert.conllu
args = --batch_size 5000
output_dir = edt_2.18/trained/morph_with_bert/stanza_full_data
model_file = model_morph_with_bert.pt
predict_after = True
#dry_run = True

[predict_stanza_tagger_morph_with_bert_full]
experiment_type = full_data
train_file = edt_2.18/preannotated/morph_with_bert/train_full.conllu
test_file  = edt_2.18/preannotated/morph_with_bert/et_edt-ud-test-morph_with_bert.conllu
model_file = edt_2.18/trained/morph_with_bert/stanza_full_data/model_morph_with_bert.pt
output_dir = edt_2.18/evaluation/morph_with_bert/stanza_full_data
use_estnltk = True
seed = 43
morph_layer = morph_with_bert
output_file_prefix = predicted_stanzatagger_
#use_gpu = True

[eval_stanza_tagger_morph_with_bert_full_data]
experiment_type = full_data
gold_train = edt_2.18/preannotated/morph_with_bert/train_full.conllu
gold_test  = edt_2.18/preannotated/morph_with_bert/et_edt-ud-test-morph_with_bert.conllu
predicted_train = edt_2.18/evaluation/morph_with_bert/stanza_full_data/predicted_stanzatagger_train.conllu
predicted_test = edt_2.18/evaluation/morph_with_bert/stanza_full_data/predicted_stanzatagger_test.conllu

